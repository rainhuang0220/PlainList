<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>下载 PlainList</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f4f2;
      --ink: #111111;
      --mut: #6a6a6a;
      --line: #d8d8d4;
      --surface: #ffffff;
    }
    html, body { min-height: 100%; overflow-x: hidden; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background:
        radial-gradient(ellipse 90% 50% at 0% 0%, rgba(17,17,17,0.05), transparent 55%),
        linear-gradient(180deg, #fafaf8 0%, var(--bg) 40%, #ecece8 100%);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }
    .nav {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 28px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 36px;
    }
    .brand {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-decoration: none;
    }
    .nav-link {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mut);
      text-decoration: none;
    }
    .nav-link:hover { color: var(--ink); }
    h1 {
      font-size: clamp(34px, 8vw, 56px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .lede {
      max-width: 38em;
      color: #333;
      font-size: 16px;
      line-height: 1.75;
      margin-bottom: 28px;
    }
    .installed {
      display: none;
      margin-bottom: 24px;
      padding: 14px 16px;
      border: 1px solid var(--ink);
      background: var(--surface);
      font-size: 13px;
      color: var(--mut);
    }
    .installed.show { display: block; }
    .kicker {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mut);
      margin-bottom: 10px;
    }
    .kicker span { color: var(--ink); font-weight: 600; }
    .hero {
      border: 1px solid var(--ink);
      background: var(--surface);
      padding: 22px 20px;
      margin-bottom: 40px;
    }
    .hero-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .hero-meta {
      font-size: 14px;
      color: var(--mut);
      margin-bottom: 16px;
      line-height: 1.65;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 12px 16px;
      border: 1px solid var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-secondary { background: transparent; color: var(--ink); }
    .btn:hover { transform: translateY(-1px); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      border: 1px solid var(--ink);
      background: var(--surface);
      padding: 22px 20px;
    }
    .card h3 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .card p {
      font-size: 13px;
      color: var(--mut);
      margin-bottom: 16px;
      line-height: 1.65;
    }
    .card .btn { width: 100%; }
    .win {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--mut);
      margin-bottom: 28px;
    }
    .meta {
      border-top: 1px solid var(--line);
      padding-top: 22px;
      font-size: 13px;
      color: var(--mut);
    }
    .meta a { color: var(--ink); }
    details.checksums { margin-top: 12px; font-size: 12px; color: var(--mut); }
    details.checksums summary { cursor: pointer; color: #333; }
    details.checksums code {
      display: block;
      margin-top: 10px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      word-break: break-all;
      color: var(--ink);
    }
    .error { color: #9b1c1c; font-size: 14px; }
    @media (max-width: 768px) {
      .wrap { width: calc(100% - 28px); padding: 28px 0 56px; }
      .nav { flex-wrap: wrap; }
      .grid { grid-template-columns: 1fr; }
      .hero-actions { flex-direction: column; }
      .hero-actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a class="brand" href="https://plainlist.space">PlainList</a>
      <a class="nav-link" href="https://plainlist.space">打开 Web 版</a>
    </div>
    <h1>下载 PlainList</h1>
    <p class="lede">在你常用的设备上继续使用 PlainList。</p>
    <p id="installed" class="installed"></p>
    <div id="hero"></div>
    <p class="kicker"><span>02</span> 其他版本</p>
    <div id="grid" class="grid"></div>
    <p class="win">Windows — 暂未提供</p>
    <div id="meta" class="meta"></div>
  </div>
  <script>
    const MANIFEST_URL = '/releases/latest.json';

    function recommend(ua) {
      if (/Android/i.test(ua)) return 'android';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'unknown';
      if (/Mac OS X|Macintosh/i.test(ua) && !/Mobile/i.test(ua)) return 'macos';
      return 'unknown';
    }

    function href(item) {
      return item.mirrorUrl || item.url;
    }

    function find(manifest, platform, arch) {
      const match = (item) => item.platform === platform && (!arch || item.arch === arch);
      if (platform === 'macos') {
        return manifest.artifacts.find((item) => match(item) && item.filename.endsWith('.dmg'))
          || manifest.artifacts.find(match);
      }
      return manifest.artifacts.find(match);
    }

    function button(item, label, primary) {
      if (!item) return '';
      const cls = primary ? 'btn btn-primary' : 'btn btn-secondary';
      return '<a class="' + cls + '" href="' + href(item) + '">' + label + '</a>';
    }

    const params = new URLSearchParams(location.search);
    const installed = params.get('client') === 'desktop'
      || params.get('client') === 'android'
      || Boolean(window.plainlistDesktop);
    if (installed) {
      const el = document.getElementById('installed');
      el.textContent = params.get('client') === 'android'
        ? '当前设备已安装 PlainList。仍可查看其他版本。'
        : '你正在使用 PlainList Desktop。仍可查看其他版本。';
      el.classList.add('show');
    }

    fetch(MANIFEST_URL, { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('manifest unavailable');
        return res.json();
      })
      .then((manifest) => {
        const rec = recommend(navigator.userAgent);
        const arm = find(manifest, 'macos', 'arm64');
        const intel = find(manifest, 'macos', 'x64');
        const android = find(manifest, 'android');
        const hero = document.getElementById('hero');
        const macHint = '打开磁盘映像，然后双击「安装 PlainList」。';
        const downloadLabel = '下载 v' + manifest.version;
        if (rec === 'android' && android) {
          hero.innerHTML = '<p class="kicker"><span>01</span> 适合这台设备</p><div class="hero"><div class="hero-title">Android</div><p class="hero-meta">APK</p><div class="hero-actions">' + button(android, downloadLabel, true) + '</div></div>';
        } else if (rec === 'macos') {
          hero.innerHTML = '<p class="kicker"><span>01</span> 适合这台设备</p><div class="hero"><div class="hero-title">macOS</div><p class="hero-meta">无法从浏览器可靠区分芯片，请按电脑选择。<br>' + macHint + '</p><div class="hero-actions">' + button(arm, 'Apple Silicon · M1 / M2 / M3 / M4 等', true) + button(intel, 'Intel Mac', false) + '</div></div>';
        } else {
          hero.innerHTML = '<p class="kicker"><span>01</span> 适合这台设备</p><div class="hero"><div class="hero-title">打开 Web 版</div><p class="hero-meta">浏览器即可使用。需要安装包时选择下方版本。</p><div class="hero-actions"><a class="btn btn-primary" href="https://plainlist.space">打开 PlainList</a></div></div>';
        }

        document.getElementById('grid').innerHTML = [
          '<div class="card"><h3>macOS · Apple Silicon</h3><p>M1 / M2 / M3 / M4 等</p>' + button(arm, downloadLabel, true) + '</div>',
          '<div class="card"><h3>macOS · Intel</h3><p>Intel Mac</p>' + button(intel, downloadLabel, true) + '</div>',
          '<div class="card"><h3>Android</h3><p>APK</p>' + button(android, downloadLabel, true) + '</div>',
          '<div class="card"><h3>Web</h3><p>浏览器</p><a class="btn btn-primary" href="https://plainlist.space">打开 PlainList</a></div>',
        ].join('');

        const sums = (manifest.artifacts || []).map((item) => item.sha256 + '  ' + item.filename).join('\n');
        document.getElementById('meta').innerHTML =
          '当前版本 v' + manifest.version +
          (manifest.publishedAt ? ' · ' + String(manifest.publishedAt).slice(0, 10) : '') +
          '<br><a href="' + manifest.githubRelease + '">GitHub Release</a>' +
          '<details class="checksums"><summary>查看校验值</summary><code>' + sums.replace(/</g, '') + '</code></details>';
      })
      .catch(() => {
        document.getElementById('hero').innerHTML = '<p class="error">暂时无法读取版本信息，请稍后重试，或前往 GitHub Release。</p>';
        document.getElementById('grid').innerHTML = '<div class="card"><h3>Web</h3><p>浏览器</p><a class="btn btn-primary" href="https://plainlist.space">打开 PlainList</a></div>';
      });
  </script>
</body>
</html>
