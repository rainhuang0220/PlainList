appId: com.plainlist.app
productName: PlainList
copyright: Copyright © 2026 rainhuang
electronVersion: 33.4.11
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
asarUnpack:
  - dist/assets/**
mac:
  category: public.app-category.productivity
  target:
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  # Do not auto-pick the local self-signed "PlainList Local Signing"
  # cert (Gatekeeper treats it worse than ad-hoc). electron-builder
  # leaves the app unsigned; scripts/sign-adhoc.sh then applies ad-hoc
  # + hardened runtime. Real Developer ID + notarization is the only
  # path to double-click-without-prompt.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  entitlements: scripts/entitlements.mac.plist
  entitlementsInherit: scripts/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 rainhuang
    CFBundleDocumentTypes: []
    NSCameraUsageDescription: PlainList 需要使用摄像头以运行 Focus Bay 专注检测。
    NSMicrophoneUsageDescription: PlainList 可能需要麦克风权限以支持插件功能。
    NSPrivacyPolicyURL: https://plainlist.space/
  # Strip unused Chromium locales — saves ~40MB.
  # PlainList's UI is in zh-CN (bundled in dist/), Electron's chrome
  # only needs en-US for native dialogs / menus.
  electronLanguages:
    - en-US
    - zh-CN
extraMetadata:
  main: electron/main.cjs
