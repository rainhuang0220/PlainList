# Short download entry. Do not serve a second download page here.
# HTTP-01 stays available so certbot can issue get.plainlist.space.
# After the certificate exists, enable the HTTPS server block.

server {
    listen 80;
    listen [::]:80;
    server_name get.plainlist.space;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://plainlist.space/download;
    }
}

# TLS is filled in after `certbot certonly --webroot`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name get.plainlist.space;

    ssl_certificate /etc/letsencrypt/live/get.plainlist.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/get.plainlist.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://plainlist.space/download;
}
